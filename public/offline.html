<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · LevelUp</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0b0c0e; color: #eceef1; font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
      main { max-width: 340px; padding: 24px; text-align: center; }
      p { color: #9aa0a9; }
      button { margin-top: 16px; height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #d6f24c; color: #14160a; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1 style="font-size: 22px; margin: 0">You’re offline</h1>
      <p>Open Today once while online and it stays available here. Taps you make offline sync when you’re back.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
